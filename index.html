<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Register — Room Booking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#1B1F1D; --paper:#F3EFE6; --paper-dim:#E8E2D2; --brass:#A9782F;
    --moss:#47593E; --rust:#8C3B2E; --ash:#8C8778; --line: rgba(243,239,230,0.16);
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top,0px);
    padding-bottom: env(safe-area-inset-bottom,0px);
  }
  :root:not([data-theme="light"]) { --bg:var(--ink); --fg:var(--paper); }
  :root[data-theme="light"] { --bg:var(--paper); --fg:var(--ink); }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) { --bg:var(--paper); --fg:var(--ink); }
  }
  html { scroll-padding-top: env(safe-area-inset-top,0px); height:100%; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100%; background:var(--bg); color:var(--fg);
    font-family:'Inter',sans-serif; line-height:1.5;
  }
  h1,h2,h3,.serif { font-family:'Fraunces',serif; font-weight:500; }
  .wrap { max-width:920px; margin:0 auto; padding:2.5rem 1.5rem 5rem; }
  header.top { display:flex; justify-content:space-between; align-items:flex-end; gap:1rem; border-bottom:1px solid var(--line); padding-bottom:1.5rem; margin-bottom:2rem; flex-wrap:wrap; }
  header.top h1 { font-size:clamp(1.8rem,4vw,2.6rem); margin:0 0 .25rem; letter-spacing:.2px; }
  header.top p { margin:0; color:var(--ash); font-size:.95rem; }
  .mode-btn { background:none; border:1px solid var(--line); color:var(--fg); padding:.55rem 1rem; border-radius:2px; font:inherit; font-size:.85rem; cursor:pointer; }
  .mode-btn:hover { border-color:var(--brass); color:var(--brass); }
  .mode-btn.active { background:var(--brass); color:var(--ink); border-color:var(--brass); }
  .status-line { display:flex; align-items:center; gap:.5rem; font-size:.8rem; color:var(--ash); margin-bottom:2rem; }
  .dot { width:6px; height:6px; border-radius:50%; background:var(--moss); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:1.1rem; }
  .card { border:1px solid var(--line); padding:1.4rem; position:relative; background:rgba(243,239,230,0.03); }
  .num { font-family:'Fraunces',serif; font-size:.75rem; color:var(--brass); letter-spacing:.5px; }
  .card h3 { margin:.35rem 0 .3rem; font-size:1.3rem; }
  .price { font-size:.95rem; color:var(--fg); margin-bottom:.6rem; }
  .price b { font-family:'Fraunces',serif; font-size:1.15rem; }
  .desc { font-size:.88rem; color:var(--ash); margin-bottom:.9rem; min-height:2.4em; }
  .badge { display:inline-flex; align-items:center; gap:.4rem; font-size:.78rem; padding:.3rem .7rem; border:1px solid; margin-bottom:1rem; }
  .badge.avail { color:var(--moss); border-color:var(--moss); }
  .badge.booked { color:var(--rust); border-color:var(--rust); }
  .row { display:flex; gap:.5rem; flex-wrap:wrap; }
  button.action { flex:1; padding:.6rem .8rem; font:inherit; font-size:.85rem; border:1px solid var(--line); background:none; color:var(--fg); cursor:pointer; }
  button.action.primary { background:var(--brass); border-color:var(--brass); color:var(--ink); font-weight:600; }
  button.action.primary:disabled { opacity:.4; cursor:not-allowed; }
  button.action:hover:not(:disabled) { border-color:var(--brass); }
  .toggle-wrap { display:flex; align-items:center; justify-content:space-between; margin-bottom:.8rem; padding:.5rem .7rem; border:1px solid var(--line); }
  .toggle-wrap span { font-size:.82rem; }
  .switch { position:relative; width:38px; height:20px; }
  .switch input { opacity:0; width:0; height:0; }
  .slider { position:absolute; inset:0; background:var(--rust); cursor:pointer; transition:.15s; border-radius:20px; }
  .slider:before { content:""; position:absolute; width:14px; height:14px; left:3px; top:3px; background:var(--paper); border-radius:50%; transition:.15s; }
  input:checked + .slider { background:var(--moss); }
  input:checked + .slider:before { transform:translateX(18px); }
  .edit-field { width:100%; font:inherit; background:var(--bg); border:1px solid var(--line); color:var(--fg); padding:.4rem .5rem; margin-bottom:.4rem; font-size:.85rem; }
  textarea.edit-field { resize:vertical; min-height:3.6em; }
  .add-card { border:1px dashed var(--line); display:flex; align-items:center; justify-content:center; min-height:220px; cursor:pointer; color:var(--ash); font-size:.9rem; }
  .add-card:hover { border-color:var(--brass); color:var(--brass); }
  .panel { margin-top:3rem; border-top:1px solid var(--line); padding-top:1.5rem; }
  .panel h2 { font-size:1.3rem; margin-bottom:1rem; }
  .req { display:flex; justify-content:space-between; gap:1rem; padding:.8rem 0; border-bottom:1px solid var(--line); font-size:.88rem; flex-wrap:wrap; }
  .req div.meta { color:var(--ash); font-size:.8rem; margin-top:.2rem; }
  .req button { background:none; border:1px solid var(--line); color:var(--ash); padding:.3rem .6rem; font:inherit; font-size:.78rem; cursor:pointer; }
  .empty { color:var(--ash); font-size:.85rem; padding:1rem 0; }
  dialog { border:1px solid var(--line); background:var(--bg); color:var(--fg); padding:1.6rem; max-width:400px; width:92vw; }
  dialog::backdrop { background:rgba(0,0,0,.55); }
  dialog h3 { margin-top:0; }
  dialog label { display:block; font-size:.8rem; color:var(--ash); margin:.7rem 0 .25rem; }
  dialog input, dialog textarea { width:100%; font:inherit; background:var(--bg); border:1px solid var(--line); color:var(--fg); padding:.5rem .6rem; font-size:.9rem; }
  dialog .row { margin-top:1.3rem; }
  .toast { position:fixed; bottom:1.5rem; left:50%; transform:translateX(-50%); background:var(--brass); color:var(--ink); padding:.7rem 1.2rem; font-size:.85rem; font-weight:600; opacity:0; pointer-events:none; transition:opacity .2s; z-index:50; }
  .toast.show { opacity:1; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>The Register</h1>
      <p>Room availability, updated live.</p>
    </div>
    <button class="mode-btn" id="modeBtn" style="display:none;">Manage rooms</button>
  </header>
  <div class="status-line"><span class="dot" id="statusDot"></span><span id="statusText">Connecting…</span></div>

  <div class="grid" id="grid"></div>

  <section class="panel" id="reqPanel" style="display:none;">
    <h2>Booking requests</h2>
    <div id="reqList"></div>
  </section>
</div>

<dialog id="bookDialog">
  <h3 class="serif">Request to book</h3>
  <p id="bookRoomName" style="color:var(--ash);font-size:.88rem;margin:0;"></p>
  <label for="bkName">Name</label>
  <input id="bkName" placeholder="Your name">
  <label for="bkPhone">Phone or email</label>
  <input id="bkPhone" placeholder="How we reach you">
  <label for="bkDates">Preferred move-in</label>
  <input id="bkDates" placeholder="e.g. October 2026">
  <label for="bkNote">Note (optional)</label>
  <textarea id="bkNote" rows="2"></textarea>
  <div class="row">
    <button class="action" id="bkCancel">Cancel</button>
    <button class="action primary" id="bkSubmit">Send request</button>
  </div>
</dialog>

<div class="toast" id="toast"></div>

<script>
let db=null, user=null, canEdit=false, editMode=false;
let rooms=[], bookings=[];
const grid=document.getElementById('grid');
const modeBtn=document.getElementById('modeBtn');
const statusDot=document.getElementById('statusDot');
const statusText=document.getElementById('statusText');
const reqPanel=document.getElementById('reqPanel');
const reqList=document.getElementById('reqList');
const toast=document.getElementById('toast');

function showToast(msg){
  toast.textContent=msg; toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t=setTimeout(()=>toast.classList.remove('show'),2200);
}

const DEFAULT_ROOMS=[
  {number:'01', name:'Garden Single', price:6000, capacity:'1 guest', desc:'Quiet room facing the courtyard, attached bath.', available:true},
  {number:'02', name:'Terrace Double', price:9500, capacity:'2 guests', desc:'Corner room with balcony access and a work desk.', available:true},
  {number:'03', name:'The Loft', price:13000, capacity:'3 guests', desc:'Top-floor room, sloped ceiling, extra bedding on request.', available:false}
];

function renderStatus(connected){
  statusDot.style.background = connected ? 'var(--moss)' : 'var(--rust)';
  statusText.textContent = connected ? (canEdit ? 'Live · you can manage rooms' : 'Live availability') : 'Viewing offline — open this page\'s link to connect';
}

function roomCardHTML(r, editing){
  const badge = r.available
    ? `<span class="badge avail">● Available</span>`
    : `<span class="badge booked">● Booked</span>`;
  if(editing){
    return `<div class="card" data-id="${r.id}">
      <span class="num">Room ${r.number||''}</span>
      <input class="edit-field ef-name" value="${escAttr(r.name)}" placeholder="Room name">
      <input class="edit-field ef-price" value="${r.price||''}" placeholder="Rent / month">
      <input class="edit-field ef-capacity" value="${escAttr(r.capacity||'')}" placeholder="Capacity, e.g. 2 guests">
      <textarea class="edit-field ef-desc" placeholder="Short description">${escAttr(r.desc||'')}</textarea>
      <div class="toggle-wrap">
        <span>Available for booking</span>
        <label class="switch"><input type="checkbox" class="ef-avail" ${r.available?'checked':''}><span class="slider"></span></label>
      </div>
      <div class="row">
        <button class="action primary" onclick="saveRoom('${r.id}')">Save</button>
        <button class="action" onclick="deleteRoom('${r.id}')">Delete</button>
      </div>
    </div>`;
  }
  return `<div class="card" data-id="${r.id}">
    <span class="num">Room ${r.number||''}</span>
    <h3>${escHTML(r.name)}</h3>
    <div class="price"><b>₹${r.price||'—'}</b> / month · ${escHTML(r.capacity||'')}</div>
    ${badge}
    <div class="desc">${escHTML(r.desc||'')}</div>
    ${canEdit ? `<div class="toggle-wrap">
        <span>Mark available</span>
        <label class="switch"><input type="checkbox" ${r.available?'checked':''} onchange="quickToggle('${r.id}', this.checked)"><span class="slider"></span></label>
      </div>` : `<button class="action primary" ${r.available?'':'disabled'} onclick="openBooking('${r.id}')">${r.available?'Request to book':'Not available'}</button>`}
  </div>`;
}

function escHTML(s){ return (s||'').replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function escAttr(s){ return escHTML(s).replace(/"/g,'&quot;'); }

function render(){
  grid.innerHTML = rooms.map(r=>roomCardHTML(r, editMode)).join('');
  if(canEdit && editMode){
    grid.insertAdjacentHTML('beforeend', `<div class="add-card" onclick="addRoom()">+ Add a room</div>`);
  }
  modeBtn.style.display = canEdit ? 'inline-block' : 'none';
  modeBtn.textContent = editMode ? 'Done editing' : 'Manage rooms';
  modeBtn.classList.toggle('active', editMode);
  reqPanel.style.display = (canEdit && editMode) ? 'block' : 'none';
  renderRequests();
}

function renderRequests(){
  if(!bookings.length){ reqList.innerHTML = `<div class="empty">No requests yet.</div>`; return; }
  reqList.innerHTML = bookings.slice().reverse().map(b=>`
    <div class="req">
      <div>
        <div><b>${escHTML(b.name)}</b> — ${escHTML(b.roomName||'')}</div>
        <div class="meta">${escHTML(b.contact||'')} · ${escHTML(b.dates||'')}${b.note?' · '+escHTML(b.note):''}</div>
      </div>
      <button onclick="clearRequest('${b.id}')">Dismiss</button>
    </div>`).join('');
}

// ---- data actions ----
async function quickToggle(id, val){
  const r = rooms.find(x=>x.id===id); if(r) r.available = val; // optimistic
  render();
  if(!db) return;
  try{ await db.doc('rooms/'+id).update({available: val}); }
  catch(e){ showToast('Could not save — try again'); }
}

async function saveRoom(id){
  const card = grid.querySelector(`.card[data-id="${id}"]`);
  const data = {
    name: card.querySelector('.ef-name').value.trim() || 'Untitled room',
    price: Number(card.querySelector('.ef-price').value) || 0,
    capacity: card.querySelector('.ef-capacity').value.trim(),
    desc: card.querySelector('.ef-desc').value.trim(),
    available: card.querySelector('.ef-avail').checked
  };
  const r = rooms.find(x=>x.id===id); Object.assign(r, data); render();
  if(!db) return;
  try{ await db.doc('rooms/'+id).update(data); showToast('Saved'); }
  catch(e){ showToast('Could not save — try again'); }
}

async function deleteRoom(id){
  rooms = rooms.filter(x=>x.id!==id); render();
  if(!db) return;
  try{ await db.doc('rooms/'+id).delete(); }
  catch(e){ showToast('Could not delete — try again'); }
}

async function addRoom(){
  const tempId = 'tmp-'+Date.now();
  const newRoom = {id:tempId, number:String(rooms.length+1).padStart(2,'0'), name:'New room', price:1000, capacity:'1 guest', desc:'', available:true};
  rooms.push(newRoom); editMode=true; render();
  if(!db) return;
  try{
    const ref = await db.collection('rooms').add({number:newRoom.number, name:newRoom.name, price:newRoom.price, capacity:newRoom.capacity, desc:newRoom.desc, available:true});
    newRoom.id = ref.id;
  }catch(e){ showToast('Could not create room'); }
}

let bookingRoomId=null;
function openBooking(id){
  const r = rooms.find(x=>x.id===id); if(!r) return;
  bookingRoomId=id;
  document.getElementById('bookRoomName').textContent = r.name+' · ₹'+r.price+'/month';
  document.getElementById('bkName').value='';
  document.getElementById('bkPhone').value='';
  document.getElementById('bkDates').value='';
  document.getElementById('bkNote').value='';
  document.getElementById('bookDialog').showModal();
}
document.getElementById('bkCancel').onclick=()=>document.getElementById('bookDialog').close();
document.getElementById('bkSubmit').onclick=async ()=>{
  const name=document.getElementById('bkName').value.trim();
  const contact=document.getElementById('bkPhone').value.trim();
  const dates=document.getElementById('bkDates').value.trim();
  const note=document.getElementById('bkNote').value.trim();
  if(!name || !contact){ showToast('Name and contact are required'); return; }
  const r = rooms.find(x=>x.id===bookingRoomId);
  const entry = {id:'local-'+Date.now(), name, contact, dates, note, roomName: r? r.name:''};
  bookings.push(entry);
  document.getElementById('bookDialog').close();
  showToast('Request sent — you\'ll be contacted directly');
  if(!db) return;
  try{ await db.collection('bookings').add({name, contact, dates, note, roomId:bookingRoomId, roomName: r?r.name:''}); }
  catch(e){ /* kept locally already */ }
};

async function clearRequest(id){
  bookings = bookings.filter(b=>b.id!==id); renderRequests();
  if(!db) return;
  try{ await db.doc('bookings/'+id).delete(); }catch(e){}
}

modeBtn.onclick=()=>{ editMode=!editMode; render(); };

// ---- boot ----
async function boot(){
  try{
    if(window.claude && window.claude.use){
      user = await window.claude.use('user');
      db = await window.claude.use('db');
    }
  }catch(e){}

  canEdit = user ? (user.canEdit ? user.canEdit() : false) : false;

  if(db){
    renderStatus(true);
    try{
      db.collection('rooms').onSnapshot(async (snap)=>{
        rooms = snap.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>(a.number||'').localeCompare(b.number||''));
        if(rooms.length===0 && canEdit){
          for(const r of DEFAULT_ROOMS){
            try{ await db.collection('rooms').add(r); }catch(e){}
          }
        } else {
          render();
        }
      });
      db.collection('bookings').onSnapshot((snap)=>{
        bookings = snap.docs.map(d=>({id:d.id, ...d.data()}));
        renderRequests();
      });
    }catch(e){
      rooms = DEFAULT_ROOMS.map((r,i)=>({id:'d'+i,...r}));
      render();
    }
  } else {
    renderStatus(false);
    rooms = DEFAULT_ROOMS.map((r,i)=>({id:'d'+i,...r}));
    render();
  }
}
boot();
</script>
</body>
</html>
